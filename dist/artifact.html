<style>
/* Layout: עמודה אחת ממורכזת למובייל, סרגל ניווט תחתון קבוע. פלטה: לילה סגלגל + זהב של מטבע. */
:root {
  --bg: #f4f3f8;
  --surface: #ffffff;
  --surface-2: #ecebf3;
  --ink: #1c1a2b;
  --ink-2: #565370;
  --line: #dcdae6;
  --gold: #b97c06;
  --gold-soft: #fbefd2;
  --violet: #5443c4;
  --violet-soft: #e7e3fb;
  --good: #1f8a4c;
  --good-soft: #dff3e7;
  --warn: #b25d00;
  --warn-soft: #fdebd6;
  --bad: #c0352b;
  --bad-soft: #fbe1de;
  --code-bg: #1e1c2c;
  --code-ink: #e9e6ff;
  --shadow: 0 1px 2px rgba(28, 26, 43, .06), 0 4px 16px rgba(28, 26, 43, .06);
  --f-body: "Heebo", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  --f-head: "Rubik", "Heebo", "Arial Hebrew", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13121c; --surface: #1d1b2a; --surface-2: #272439; --ink: #eeecf8; --ink-2: #a9a5c4; --line: #34304a;
    --gold: #f2b544; --gold-soft: #3a2f17; --violet: #a497ff; --violet-soft: #2c2750;
    --good: #5fd08f; --good-soft: #17301f; --warn: #f3a44b; --warn-soft: #3a2812; --bad: #ff8277; --bad-soft: #3d1c1a;
    --code-bg: #0e0d16; --code-ink: #e9e6ff; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13121c; --surface: #1d1b2a; --surface-2: #272439; --ink: #eeecf8; --ink-2: #a9a5c4; --line: #34304a;
  --gold: #f2b544; --gold-soft: #3a2f17; --violet: #a497ff; --violet-soft: #2c2750;
  --good: #5fd08f; --good-soft: #17301f; --warn: #f3a44b; --warn-soft: #3a2812; --bad: #ff8277; --bad-soft: #3d1c1a;
  --code-bg: #0e0d16; --code-ink: #e9e6ff; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 1.45rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand .coin { width: 30px; height: 30px; flex: none; }
.brand b { font-family: var(--f-head); font-size: 1.02rem; display: block; line-height: 1.2; }
.brand span { font-size: .78rem; color: var(--ink-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-pill { font-size: .75rem; padding: 4px 10px; border-radius: 99px; background: var(--violet-soft); color: var(--violet); white-space: nowrap; font-weight: 600; }

main { padding-block: 16px 8px; display: flex; flex-direction: column; gap: 14px; }

/* Bottom nav */
.nav { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-inline: max(0px, env(safe-area-inset-left, 0px)) max(0px, env(safe-area-inset-right, 0px)); }
.nav .row { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--ink-2); font-size: .72rem; font-weight: 500; }
.nav a svg { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--violet); }
.nav a[aria-current="page"] svg { stroke-width: 2.2; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.card.hero { background: linear-gradient(160deg, var(--violet-soft), var(--surface) 70%); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .grid2.stack-sm { grid-template-columns: 1fr; } }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }

/* Buttons */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--violet); }
.btn.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #14121f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #14121f; } }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1c1407; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

/* Chips / badges */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .86rem; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.gold { background: var(--gold-soft); color: var(--gold); }
.badge.violet { background: var(--violet-soft); color: var(--violet); }

/* Stage track */
.stages { display: flex; flex-direction: column; gap: 10px; }
.stage { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.stage .dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface-2); color: var(--ink-2); font-family: var(--f-head); }
.stage.done .dot { background: var(--good-soft); color: var(--good); }
.stage.active { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet) inset; }
.stage.active .dot { background: var(--violet); color: #fff; }
.stage.locked { opacity: .65; }
.stage b { display: block; font-family: var(--f-head); }
.stage small { color: var(--ink-2); display: block; font-size: .8rem; line-height: 1.4; }

/* Progress */
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--violet); border-radius: 99px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.stat b { font-family: var(--f-head); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--ink-2); }

/* Question list */
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qitem { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; text-align: start; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; width: 100%; }
.qitem:hover { border-color: var(--violet); }
.qitem p { font-size: .94rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qitem .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.score-dot { min-width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--f-head); font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--ink-2); font-size: .92rem; }
.score-dot.good { background: var(--good-soft); color: var(--good); }
.score-dot.warn { background: var(--warn-soft); color: var(--warn); }
.score-dot.bad { background: var(--bad-soft); color: var(--bad); }

/* Question runner */
.qtext { font-family: var(--f-head); font-size: 1.12rem; font-weight: 500; line-height: 1.55; }
.code { background: var(--code-bg); color: var(--code-ink); border-radius: 12px; padding: 14px; overflow-x: auto; font-family: var(--f-mono); font-size: .8rem; line-height: 1.55; direction: ltr; text-align: left; white-space: pre; margin: 0; tab-size: 4; }
.code.wrap-pre { white-space: pre-wrap; }
textarea.answer { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); line-height: 1.6; }
textarea.answer.codeed { font-family: var(--f-mono); font-size: .82rem; direction: ltr; text-align: left; min-height: 220px; white-space: pre; tab-size: 4; }
.rec { display: flex; align-items: center; gap: 14px; }
.recbtn { width: 72px; height: 72px; border-radius: 50%; border: none; background: var(--bad); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; box-shadow: 0 4px 14px rgba(192, 53, 43, .35); }
.recbtn svg { width: 30px; height: 30px; }
.recbtn.on { animation: pulse 1.4s ease-in-out infinite; }
.recbtn.stop { background: var(--ink); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(192, 53, 43, .45); } 50% { box-shadow: 0 0 0 12px rgba(192, 53, 43, 0); } }
@media (prefers-reduced-motion: reduce) { .recbtn.on { animation: none; } }
.timer { font-family: var(--f-head); font-size: 1.6rem; font-variant-numeric: tabular-nums; direction: ltr; }
.timer.over { color: var(--bad); }
.interim { color: var(--ink-2); font-style: italic; min-height: 1.4em; font-size: .92rem; }
audio { width: 100%; }

/* Feedback */
.fb-head { display: flex; align-items: center; gap: 14px; }
.ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--ring-c, var(--violet)) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring > span { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.fb-sec { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.fb-sec h3 { display: flex; align-items: center; gap: 6px; }
.fb-sec ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.fix { border-inline-start: 3px solid var(--bad); padding-inline-start: 10px; }
.fix b { display: block; }
.points { list-style: none; padding: 0 !important; }
.points li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; }
.points li .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; margin-top: 3px; }
.points li.hit .ic { background: var(--good-soft); color: var(--good); }
.points li.miss .ic { background: var(--surface-2); color: var(--ink-2); }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.metrics .stat b { font-size: 1.05rem; }
.note { padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); color: var(--ink); font-size: .88rem; }
.note.violet { background: var(--violet-soft); }
.note.bad { background: var(--bad-soft); }
details { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
details > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; font-weight: 700; color: var(--ink-2); }
details[open] > summary::after { content: "–"; }
details[open] > summary { margin-bottom: 8px; }

/* Glossary */
.search { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); min-height: 46px; }
.term { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.term h3 { font-family: var(--f-mono); font-size: .95rem; font-weight: 600; }
.term .ex { font-size: .88rem; color: var(--ink-2); border-inline-start: 2px solid var(--gold); padding-inline-start: 8px; }
.term .row { gap: 6px; }

/* Forms */
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .92rem; }
label.field input, label.field select, label.field textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); font-weight: 400; min-height: 44px; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--violet); }
.toast { position: fixed; inset-inline: 16px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 40; max-width: 520px; margin: 0 auto;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: .92rem; box-shadow: var(--shadow); }
.confirm { border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 24px 12px; color: var(--ink-2); }
hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.job li { margin-bottom: 4px; }
.kbd { font-family: var(--f-mono); font-size: .8rem; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

</style>

  sol:`public class Pool<T> where T : Component
{
    private readonly T prefab;
    private readonly Transform parent;
    private readonly Stack<T> free = new Stack<T>();
    private readonly HashSet<T> inUse = new HashSet<T>();
    private readonly Action<T> onGet;
    private readonly Action<T> onRelease;

    public Pool(T prefab, int prewarm, Transform parent = null,
                Action<T> onGet = null, Action<T> onRelease = null)
    {
        this.prefab = prefab;
        this.parent = parent;
        this.onGet = onGet;
        this.onRelease = onRelease;
        for (int i = 0; i < prewarm; i++)
            free.Push(Create());
    }

    private T Create()
    {
        T item = Object.Instantiate(prefab, parent);
        item.gameObject.SetActive(false);
        return item;
    }

    public T Get()
    {
        T item = free.Count > 0 ? free.Pop() : Create();   // מתרחב כשריק
        inUse.Add(item);
        item.gameObject.SetActive(true);
        onGet?.Invoke(item);                                 // איפוס State
        return item;
    }

    public void Release(T item)
    {
        if (!inUse.Remove(item))
        {
            Debug.LogWarning("Release on item that is not in use: " + item);
            return;                                          // מניעת החזרה כפולה
        }
        onRelease?.Invoke(item);
        item.gameObject.SetActive(false);
        free.Push(item);
    }
}`,

  sol:`public class ServerCountdown
{
    private readonly long expiresAtUnix;
    private readonly long serverNowAtSync;
    private readonly float realtimeAtSync;

    public ServerCountdown(long serverNowUnix, long expiresAtUnix)
    {
        this.expiresAtUnix = expiresAtUnix;
        serverNowAtSync = serverNowUnix;
        realtimeAtSync = Time.realtimeSinceStartup;   // שעון מונוטוני, לא מושפע משינוי שעה
    }

    private double ServerNow =>
        serverNowAtSync + (Time.realtimeSinceStartup - realtimeAtSync);

    public double SecondsLeft => System.Math.Max(0, expiresAtUnix - ServerNow);
    public bool IsExpired => SecondsLeft <= 0;
}`,

  sol:`public class SpinMachine : MonoBehaviour
{
    public event Action<SpinState> OnStateChanged;
    public SpinState State { get; private set; } = SpinState.Idle;
    [SerializeField] private float minSpinSeconds = 1f;

    private void SetState(SpinState s) { State = s; OnStateChanged?.Invoke(s); }

    public void RequestSpin()
    {
        if (State != SpinState.Idle) return;          // חסימת לחיצה כפולה
        StartCoroutine(SpinFlow());
    }

    private IEnumerator SpinFlow()
    {
        SetState(SpinState.Spinning);
        float started = Time.time;
        SpinResult result = null;
        bool failed = false;
        Api.Spin(r => result = r, _ => failed = true); // callback ב-Main Thread

        yield return new WaitUntil(() => Time.time - started >= minSpinSeconds);
        if (result == null && !failed) SetState(SpinState.WaitingForServer);
        yield return new WaitUntil(() => result != null || failed);

        if (failed) { SetState(SpinState.Idle); ShowError(); yield break; }

        SetState(SpinState.ShowingResult);
        yield return ShowResult(result);               // אנימציה בלבד, היתרה כבר מהשרת
        SetState(SpinState.Idle);
    }

    private IEnumerator ShowResult(SpinResult r) { yield return null; }
    private void ShowError() { }
}`,

  sol:`public class Inventory
{
    private readonly Dictionary<string, int> counts = new Dictionary<string, int>();
    private readonly Dictionary<string, ItemDef> defs = new Dictionary<string, ItemDef>();
    public event Action<string, int> OnChanged;

    public int Count(string itemId) => counts.TryGetValue(itemId, out int c) ? c : 0;

    public bool TryAdd(ItemDef item, int amount)
    {
        if (item == null || amount <= 0) return false;
        int current = Count(item.Id);
        if (current + amount > item.MaxStack) return false;   // החלטה: לא מוסיפים חלקית
        defs[item.Id] = item;
        counts[item.Id] = current + amount;
        OnChanged?.Invoke(item.Id, counts[item.Id]);
        return true;
    }

    public bool TryRemove(string itemId, int amount)
    {
        if (amount <= 0) return false;
        int current = Count(itemId);
        if (current < amount) return false;
        int left = current - amount;
        if (left == 0) counts.Remove(itemId); else counts[itemId] = left;
        OnChanged?.Invoke(itemId, left);
        return true;
    }
}

  prompt:"Live Coding (40 דקות). ממש ImageLoader שטוען Texture מ-URL, מחזיק Cache בזיכרון עם מגבלת כמות (LRU), לא מוריד פעמיים אותו URL כשיש שתי בקשות במקביל, ומאפשר ביטול.",
  code:`public class ImageLoader
{
    public Task<Texture2D> LoadAsync(string url, CancellationToken ct) { throw new NotImplementedException(); }
}`,
  sol:`public class ImageLoader
{
    private readonly int capacity;
    private readonly Dictionary<string, LinkedListNode<(string url, Texture2D tex)>> map = new();
    private readonly LinkedList<(string url, Texture2D tex)> lru = new();
    private readonly Dictionary<string, Task<Texture2D>> inFlight = new();

    public ImageLoader(int capacity) { this.capacity = capacity; }

    public async Task<Texture2D> LoadAsync(string url, CancellationToken ct)
    {
        if (map.TryGetValue(url, out var node))
        {
            lru.Remove(node); lru.AddFirst(node);          // עדכון LRU
            return node.Value.tex;
        }
        if (!inFlight.TryGetValue(url, out var task))
        {
            task = Download(url);                           // מניעת הורדה כפולה
            inFlight[url] = task;
        }
        try
        {
            var tex = await task;
            ct.ThrowIfCancellationRequested();             // הקורא ביטל – ההורדה נשמרת ל-Cache
            return tex;
        }
        finally { inFlight.Remove(url); }
    }

    private async Task<Texture2D> Download(string url)
    {
        using var req = UnityWebRequestTexture.GetTexture(url);
        var op = req.SendWebRequest();
        while (!op.isDone) await Task.Yield();
        if (req.result != UnityWebRequest.Result.Success) throw new Exception(req.error);
        var tex = DownloadHandlerTexture.GetContent(req);
        Put(url, tex);
        return tex;
    }

    private void Put(string url, Texture2D tex)
    {
        if (map.ContainsKey(url)) return;
        var node = lru.AddFirst((url, tex));
        map[url] = node;
        if (map.Count > capacity)
        {
            var last = lru.Last;
            lru.RemoveLast();
            map.Remove(last.Value.url);
            Object.Destroy(last.Value.tex);                 // שחרור זיכרון Native
        }
    }
}`,

  code:`public struct Entry { public string Id; public int Score; }

public static List<Entry> TopK(IReadOnlyList<Entry> all, int k)
{
    throw new NotImplementedException();
}`,
  sol:`public static List<Entry> TopK(IReadOnlyList<Entry> all, int k)
{
    if (k <= 0) return new List<Entry>();
    // Min-Heap בגודל k: O(n log k) זמן, O(k) זיכרון
    var heap = new PriorityQueue<Entry, int>();      // .NET 6+; ב-Unity ייתכן שצריך מימוש עצמי
    foreach (var e in all)
    {
        if (heap.Count < k) heap.Enqueue(e, e.Score);
        else if (heap.TryPeek(out _, out int min) && e.Score > min)
        {
            heap.Dequeue();
            heap.Enqueue(e, e.Score);
        }
    }
    var result = new List<Entry>(heap.Count);
    while (heap.Count > 0) result.Add(heap.Dequeue());
    result.Reverse();                                 // סדר יורד
    return result;
}
// חלופה פשוטה: מיון מלא O(n log n) – בסדר ל-n קטן.
// Stream: אותו Min-Heap עובד כי הוא לא צריך את כל הנתונים בזיכרון.`,

{ id:"c-ui-pool", k:"impl", lv:2, time:20, title:"רשימה ממוחזרת לחנות",
  prompt:"כתוב את הליבה של רשימת UI ממוחזרת: יש 200 פריטים, רק 8 כרטיסים נראים. בגלילה, הכרטיסים מתמחזרים ומקבלים נתונים חדשים. התמקד בלוגיקת המיפוי בין Scroll Position לאינדקסים – לא בעיצוב.",
  code:`public class RecycledList : MonoBehaviour
{
    [SerializeField] private RectTransform content;
    [SerializeField] private ItemCard cardPrefab;
    [SerializeField] private float itemHeight = 120f;
    private IReadOnlyList<ItemData> data;
    // TODO
}`,
  sol:`public class RecycledList : MonoBehaviour
{
    [SerializeField] private ScrollRect scroll;
    [SerializeField] private RectTransform content;
    [SerializeField] private ItemCard cardPrefab;
    [SerializeField] private float itemHeight = 120f;
    [SerializeField] private int visibleCount = 8;
    private readonly List<ItemCard> cards = new List<ItemCard>();
    private IReadOnlyList<ItemData> data;
    private int firstIndex = -1;

    public void SetData(IReadOnlyList<ItemData> items)
    {
        data = items;
        content.sizeDelta = new Vector2(content.sizeDelta.x, items.Count * itemHeight);
        int needed = Mathf.Min(visibleCount + 2, items.Count);   // באפר קטן
        while (cards.Count < needed) cards.Add(Instantiate(cardPrefab, content));
        firstIndex = -1;
        Refresh();
    }

    void OnEnable()  => scroll.onValueChanged.AddListener(OnScroll);
    void OnDisable() => scroll.onValueChanged.RemoveListener(OnScroll);
    void OnScroll(Vector2 _) => Refresh();

    void Refresh()
    {
        int first = Mathf.Clamp(Mathf.FloorToInt(content.anchoredPosition.y / itemHeight),
                                0, Mathf.Max(0, data.Count - cards.Count));
        if (first == firstIndex) return;                      // אין שינוי – לא נוגעים ב-UI
        firstIndex = first;
        for (int i = 0; i < cards.Count; i++)
        {
            int dataIndex = first + i;
            var rt = (RectTransform)cards[i].transform;
            rt.anchoredPosition = new Vector2(0, -dataIndex * itemHeight);
            cards[i].Bind(data[dataIndex]);   // Bind מבטל טעינת תמונה קודמת ובודק רלוונטיות
        }
    }
}`,

     ["Bind של נתונים לכרטיס","bind|נתונים"],

  sol:`private CancellationTokenSource tabCts;
private string currentTab;

async void OnTabClicked(string tab)
{
    currentTab = tab;
    tabCts?.Cancel();
    tabCts?.Dispose();
    tabCts = new CancellationTokenSource();
    var token = tabCts.Token;

    {
        var items = await Api.GetShopItemsAsync(tab, token);

        grid.Show(items);
    }
    catch (OperationCanceledException) { }

<script>
/* js/engine.js */
/* מנוע: שמירת התקדמות, הקלטה ותמלול, והערכת תשובות (AI או הערכה בסיסית לא מקוונת). */
(function () {
  const STORE_KEY = "moonprep.v1";

  /* ───────── Storage ───────── */
  const defaults = () => ({
    unlocked: { tl: true, tech: false, final: false },
    finished: { hr: true, tl: false, tech: false, final: false },
    attempts: {},       // id -> [{ts, text, code, mode, dur, score, src, fb}]
    sessions: [],       // [{ts, stage, items:[{id, score}], avg}]
    cm: { done: {}, notes: "" },
    settings: { apiKey: "", model: "claude-opus-5-5", provider: "auto", keepAudio: true, theme: "system", qSeconds: 120 }
  });
  let state = defaults();
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        const d = defaults();
        state = Object.assign(d, s);
        state.settings = Object.assign(d.settings, s.settings || {});
        state.unlocked = Object.assign(d.unlocked, s.unlocked || {});
        state.finished = Object.assign(d.finished, s.finished || {});
        state.cm = Object.assign(d.cm, s.cm || {});
      }
    } catch (e) { state = defaults(); }
    return state;
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }
  function exportJSON() { const s = JSON.parse(JSON.stringify(state)); s.settings.apiKey = ""; return JSON.stringify(s); }
  function importJSON(txt) {
    const s = JSON.parse(txt);
    if (!s || typeof s !== "object" || !s.attempts) throw new Error("bad");
    const key = state.settings.apiKey;
    state = Object.assign(defaults(), s);
    state.settings = Object.assign(defaults().settings, s.settings || {}, { apiKey: key });
    save();
  }
  function reset() { const key = state.settings.apiKey; state = defaults(); state.settings.apiKey = key; save(); }

  function addAttempt(id, a) { (state.attempts[id] = state.attempts[id] || []).push(a); save(); }
  function best(id) { const a = state.attempts[id]; if (!a || !a.length) return null; return Math.max(...a.map(x => x.score ?? 0)); }
  function last(id) { const a = state.attempts[id]; return a && a.length ? a[a.length - 1] : null; }

  /* ───────── Text utils ───────── */
  function norm(s) {
    return (s || "").toLowerCase()
      .replace(/[֑-ׇ]/g, "")        // ניקוד וטעמים
      .replace(/[׳`’‘]/g, "'").replace(/[״“”]/g, '"')
      .replace(/[־–—_]/g, "-")
      .replace(/\s+/g, " ");
  }
  function words(s) { return (s || "").trim().split(/\s+/).filter(Boolean); }
  const FILLERS = ["אממ", "אמממ", "אהה", "אההה", "אמ ", "כאילו", "יעני", "נגיד", "וכזה", "סתם", "את יודע", "אתה יודע"];
  function fillerCount(text) {
    const t = " " + norm(text) + " ";
    const found = {};
    let total = 0;
    FILLERS.forEach(f => {
      const re = new RegExp("(^|\\s)" + f.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?=\\s|[.,!?]|$)", "g");
      const m = t.match(re);
      if (m && m.length) { found[f.trim()] = m.length; total += m.length; }
    });
    return { total, found };
  }
  function coverage(points, text) {
    const t = norm(text);
    return (points || []).map(([label, kws]) => {
      const list = (kws || "").split("|").map(k => norm(k).trim()).filter(Boolean);
      const hit = list.some(k => t.includes(k));
      return { label, hit };
    });
  }

  /* ───────── Offline evaluation ───────── */
  function offlineEval(item, answer, meta) {
    const text = [answer.text, answer.code].filter(Boolean).join("\n");
    const cov = coverage(item.p, text);
    const hits = cov.filter(c => c.hit).length;
    const ratio = cov.length ? hits / cov.length : 0;
    const wc = words(answer.text).length + (answer.code ? Math.round(words(answer.code).length / 3) : 0);
    let score = 2 + 8 * ratio;
    if (wc < 12) score = Math.min(score, 3);
    else if (wc < 25) score -= 1.5;
    score = Math.max(0, Math.min(10, Math.round(score * 2) / 2));
    return {
      src: "offline",
      score,
      verdict: ratio >= .75 ? "כיסית את רוב הנקודות שמראיין יחפש." : ratio >= .45 ? "כיסית חלק מהנקודות. בדוק מה חסר למטה." : "חסרות נקודות מרכזיות. עבור על נקודות המפתח ונסה שוב.",
      coverage: cov,
      strengths: cov.filter(c => c.hit).map(c => c.label),
      missing: cov.filter(c => !c.hit).map(c => c.label),
      corrections: [],
      interviewer_expects: item.t || "",
      better_phrasing: "",
      delivery: [],
      follow_up: (item.f && item.f[0]) || "",
      note: "הערכה בסיסית לפי מילות מפתח. היא בודקת אילו נושאים הזכרת, לא אם ההסבר נכון. להערכת AI מלאה, הגדר חיבור בלשונית הגדרות."
    };
  }

  /* ───────── AI evaluation ───────── */
  const SCHEMA = {
    type: "object",
    additionalProperties: false,
    required: ["score", "verdict", "strengths", "corrections", "missing", "interviewer_expects", "delivery", "better_phrasing", "follow_up"],
    properties: {
      score: { type: "number" },
      verdict: { type: "string" },
      strengths: { type: "array", items: { type: "string" } },
      corrections: { type: "array", items: { type: "object", additionalProperties: false, required: ["issue", "fix"], properties: { issue: { type: "string" }, fix: { type: "string" } } } },
      missing: { type: "array", items: { type: "string" } },
      interviewer_expects: { type: "string" },
      delivery: { type: "array", items: { type: "string" } },
      better_phrasing: { type: "string" },
      follow_up: { type: "string" }
    }
  };

  function buildPrompt(item, answer, meta) {
    const D = window.APP_DATA;
    const kp = (item.p || []).map(p => "- " + p[0]).join("\n");
    const mistakes = (item.m || []).map(x => "- " + x).join("\n") || "-";
    const stageName = meta.stage === "tech" ? "ריאיון טכני (Code Review / Live Coding)" : meta.stage === "final" ? "ריאיון סופי" : "ריאיון שיחה מול Unity Team Lead";
    const del = meta.mode === "voice"
      ? `התשובה נאמרה בעל פה ותומללה אוטומטית (ייתכנו טעויות תמלול – אל תוריד ציון עליהן). משך: ${Math.round(meta.dur || 0)} שניות, ${meta.words} מילים, מילות מילוי שזוהו: ${meta.fillers}.`
      : "התשובה הוקלדה.";
    return `אתה Unity Team Lead מנוסה ב-Moon Active שמראיין מועמד לתפקיד Unity Developer (לא תפקיד ניהולי), ומאמן אותו. הערך את התשובה שלו בכנות ובדיוק.

המשרה (Moon Active, Unity Developer, AI-first mindset):
${D.job.summary}
אחריות: ${D.job.responsibilities.join(" ")}
דרישות: ${D.job.requirements.join(" ")}
יתרונות: ${D.job.advantages.join(" ")}

רקע המועמד (אל תמציא ניסיון מעבר לזה):
${D.profile.facts.map(f => "- " + f).join("\n")}

שלב: ${stageName}
סוג: ${item.k ? D.stage2Kinds[item.k].he : "שאלת שיחה"}

השאלה:
${item.q || item.prompt}
${item.code ? "\nקוד שהוצג למועמד:\n```csharp\n" + item.code + "\n```" : ""}

נקודות שמראיין מצפה לשמוע:
${kp}
טעויות נפוצות:
${mistakes}
${item.sol ? "\nפתרון לדוגמה (להשוואה בלבד, אל תדרוש התאמה מילולית):\n" + item.sol : ""}

${del}

תשובת המועמד:
"""
${answer.text || "(אין הסבר מילולי)"}
"""
${answer.code ? "קוד שהמועמד כתב:\n```csharp\n" + answer.code + "\n```" : ""}

הנחיות:
1. ציון 0-10 (חצאים מותרים). אל תעלה ציון כדי לעודד. 7 = כיוון נכון עם חוסרים, 8.5 = טוב מאוד, 9.5+ = כמעט מושלם.
2. הפרד בין "העיקרון נכון" לבין "המימוש הטכני מדויק". תקן כל טעות טכנית במפורש והסבר בפשטות.
3. אם המועמד אמר שהוא לא יודע משהו, הערך איך התמודד: כנות, עקרונות, ואיך היה חוקר. אל תדרוש שיעמיד פנים.
4. AI הוא יתרון אבל לא תחליף להבנה – אם הוא מציג את ה-AI כמקבל ההחלטות, ציין זאת.
5. better_phrasing: לא תשובה מושלמת לשינון. 2-4 משפטים קצרים שמשמרים את הסגנון שלו ומוסיפים את מה שחסר.
6. delivery: הערות על אופן ההעברה בעל פה (מבנה, אורך, בהירות, מילות מילוי). אם הוקלד – הערות על מבנה ובהירות.
7. follow_up: שאלת המשך אחת חדשה שמראיין היה שואל, שמעמיקה בנקודה החלשה.
8. כתוב הכול בעברית. מונחים טכניים ושמות קוד – באנגלית, בתוך משפט עברי.
9. אל תמציא עובדות על Moon Active או על Coin Master שלא הופיעו כאן.

החזר JSON בלבד לפי המבנה: score, verdict (משפט אחד), strengths[], corrections[{issue, fix}], missing[], interviewer_expects, delivery[], better_phrasing, follow_up.`;
  }

  let sampleFn = null, samplePromise = null;
  function initSample() {
    if (samplePromise) return samplePromise;
    samplePromise = (async () => {
      try {
        if (window.claude && typeof window.claude.use === "function") sampleFn = await window.claude.use("sample");
      } catch (e) { sampleFn = null; }

    })();

  }
  const IN_CLAUDE = !!(window.claude && typeof window.claude.use === "function");
  let dictation = null, dictationPromise = null, tts = null, perms = null;
  function initDictation() {
    if (dictationPromise) return dictationPromise;

      try {
        if (IN_CLAUDE) {
          const [d, t, p] = await Promise.all(["dictation", "tts", "permissions"].map(n => window.claude.use(n).catch(() => null)));
          dictation = d; tts = t; perms = p;
        }
      } catch (e) { dictation = null; }

    })();
    return dictationPromise;
  }

  function providerAvailable() {
    const s = state.settings;
    if (s.provider === "offline") return "offline";
    if ((s.provider === "auto" || s.provider === "claude") && sampleFn) return "claude";
    if ((s.provider === "auto" || s.provider === "api") && s.apiKey) return "api";
    return "offline";
  }

  function parseJSON(text) {
    const t = (text || "").trim();
    try { return JSON.parse(t); } catch (e) { }
    const m = t.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);

  }
  function cleanFb(fb) {
    const arr = v => Array.isArray(v) ? v.filter(x => x != null).map(x => typeof x === "string" ? x : x) : [];
    return {
      score: Math.max(0, Math.min(10, Number(fb.score) || 0)),
      verdict: String(fb.verdict || ""),
      strengths: arr(fb.strengths).map(String),
      corrections: arr(fb.corrections).map(c => typeof c === "string" ? { issue: c, fix: "" } : { issue: String(c.issue || ""), fix: String(c.fix || "") }),
      missing: arr(fb.missing).map(String),
      interviewer_expects: String(fb.interviewer_expects || ""),
      delivery: arr(fb.delivery).map(String),

  let sdkPromise = null;
  function loadSDK() {
    if (!sdkPromise) sdkPromise = import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.7.0/+esm").then(m => m.default || m.Anthropic);

  }
  async function callAPI(prompt, signal) {
    const Anthropic = await loadSDK();

    const model = state.settings.model || "claude-opus-5-5";

      model,
      max_tokens: 16000,
      output_config: { effort: "medium", format: { type: "json_schema", schema: SCHEMA } },

    if (model === "claude-opus-5-5" || model === "claude-sonnet-5-5") {
      res = await client.beta.messages.create({ ...req, betas: ["server-side-fallback-2026-07-01"], fallbacks: "default" }, { signal });
    } else {
      res = await client.messages.create(req, { signal });
    }
    if (res.stop_reason === "refusal") throw Object.assign(new Error("refusal"), { code: "refusal" });
    const text = (res.content || []).filter(b => b.type === "text").map(b => b.text).join("");

  }
  async function callSample(prompt, signal) {

  }

  async function evaluate(item, answer, meta, signal) {

    meta.words = words(answer.text).length;

      const prompt = buildPrompt(item, answer, meta);
      const raw = prov === "claude" ? await callSample(prompt, signal) : await callAPI(prompt, signal);
      const fb = cleanFb(raw);

    if (code === 401 || code === "authentication_error") return "מפתח ה-API לא תקין.";
    if (code === "refusal") return "המודל לא החזיר הערכה לתשובה הזו.";
    if (String(e && e.message || "").includes("Failed to fetch") || String(e).includes("import")) return "אין חיבור לשירות ה-AI.";
    return "הערכת ה-AI נכשלה.";
  }

  async function sessionSummary(items) {
    const prov = providerAvailable();
    if (prov === "offline") return null;
    const lines = items.map((x, i) => `${i + 1}. [${x.score}/10] ${x.q}\nתשובה: ${(x.text || "").slice(0, 900)}\nחסר: ${(x.missing || []).join("; ")}`).join("\n\n");
    const prompt = `אתה Unity Team Lead ב-Moon Active שסיים סימולציית ריאיון עם מועמד ל-Unity Developer. כתוב דוח מסכם קצר בעברית (מונחים טכניים באנגלית): רמת מוכנות כללית במשפט אחד, 3 חוזקות, 3 פערים לעבודה, ו-3 נושאים לחזרה לפני הריאיון האמיתי. אל תמציא עובדות. החזר JSON בלבד: {"readiness":"", "strengths":[], "gaps":[], "review":[]}.\n\n${lines}`;
    try {
      const raw = prov === "claude" ? (await sampleFn(prompt, { modelTier: "default", cache: false })).text : null;
      if (raw) return parseJSON(raw);
      const Anthropic = await loadSDK();
      const client = new Anthropic({ apiKey: state.settings.apiKey, dangerouslyAllowBrowser: true });
      const res = await client.messages.create({ model: state.settings.model, max_tokens: 16000, output_config: { effort: "medium" }, messages: [{ role: "user", content: prompt }] });

    } catch (e) { return null; }

  /* ───────── Recording & transcription ───────── */

      }

          this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          this.mr = new MediaRecorder(this.stream);

    }

      if (this.rec) { try { this.rec.stop(); } catch (e) { this.finish(); } }

      if (this.offs) { this.offs.forEach(f => { try { f(); } catch (e) { } }); this.offs = null; }
      if (this._done) { this._done = false; }
      this.stopMedia(true);
      this.onInterim("");
      this.onState("off", reason);
    }
    seconds() { return this.elapsed + (this.active ? (performance.now() - this.startedAt) / 1000 : 0); }
    resetTime() { this.elapsed = 0; }
  }

  /* ───────── Speak question (TTS) ───────── */
  function speak(text) {
    if (tts) {
      tts.speak(text, { language: "he" }).catch(e => {
        if (e && e.code === "unavailable") tts.speak(text).catch(() => browserSpeak(text));

  }

  window.Engine = {

      <p class="muted">${esc(stageOf(cur).desc)}</p>
      <div class="grid2">
        <div class="stat"><b>${ss.answered}/${ss.total}</b><span>שאלות שתרגלת בשלב</span></div>
        <div class="stat"><b>${fmt(ss.avg)}</b><span>ממוצע הציון הטוב ביותר</span></div>
      </div>

      <div class="grid2 stack-sm">
        <a class="btn primary" href="#sim">${icon("mic")} סימולציית ריאיון</a>

      </div>
      ${ss.weak ? `<button class="btn ghost sm" id="weakQ">חזרה על ${ss.weak} שאלות עם ציון מתחת ל-7</button>` : ""}
    </section>

    ${cur === "tl" && resume && !resumeDone ? `
    <section class="card">
      <div class="row between"><h2>נקודת ההמשך מהשיחה הקודמת</h2><span class="badge gold">לא נענתה</span></div>
      <p>${esc(resume.q)}</p>
      <a class="btn" href="#q-${resume.id}">${icon("mic")} ענה עכשיו</a>
    </section>` : ""}

    <section class="card">
      <h2>שלבי התהליך</h2>
      <div class="stages">
        ${STAGES.map(s => {
          const done = st.finished[s.key], unlocked = s.key === "hr" || st.unlocked[s.key], active = s.key === cur;
          const cls = done ? "done" : active ? "active" : unlocked ? "" : "locked";
          const stt = s.key !== "hr" && unlocked ? stageStats(s.key) : null;
          return `<div class="stage ${cls}">
            <div class="dot">${done ? "✓" : unlocked ? s.n : icon("lock")}</div>
            <div><b>${esc(s.name)}</b><small>${done ? "הושלם" : unlocked ? (stt ? `${stt.answered}/${stt.total} תורגלו · ממוצע ${fmt(stt.avg)}` : esc(s.desc)) : "נפתח אחרי סיום השלב הקודם"}</small></div>
            <div>${unlocked && s.key !== "hr" ? `<a class="btn sm ghost" href="#practice" data-stage="${s.key}">תרגול</a>` : ""}</div>
          </div>`;
        }).join("")}
      </div>
      ${cur !== "final" || !st.finished.final ? `<div id="finishBox">
        <button class="btn block" id="finishBtn">${icon("check")} ${cur === "tl" ? "סיימתי את ריאיון ה-Team Lead – פתח את השלב הבא" : cur === "tech" ? "סיימתי את הריאיון הטכני – פתח את הריאיון הסופי" : "סיימתי את הריאיון הסופי"}</button>
      </div>` : ""}
    </section>

    <section class="card">
      <h2>הערכת התשובות</h2>
      ${prov === "offline"
        ? `<p class="note">כרגע ההערכה בסיסית: בודקת אילו נקודות מפתח הזכרת, בלי לבדוק דיוק. כדי לקבל ציון, תיקונים ומשוב של מראיין, חבר AI בלשונית <a href="#settings">הגדרות</a>.</p>`
        : `<p class="note violet">הערכת AI פעילה (${prov === "claude" ? "Claude דרך claude.ai" : "Claude API עם המפתח שלך"}). כל תשובה מקבלת ציון, תיקונים, מה המראיין מצפה לשמוע ושאלת המשך.</p>`}
      <p class="small muted">איך עונים: לוחצים על המיקרופון ומדברים כמו בריאיון. התמלול מופיע בתיבה ואפשר לתקן אותו לפני שליחה. אם התמלול לא עובד במכשיר, אפשר להשתמש במיקרופון של המקלדת בתוך התיבה.</p>
    </section>

    <details class="card flat"><summary>המסרים שלך – לשמר בכל תשובה</summary>
      <p class="note">${esc(D.profile.oneLiner)}</p>
      <ul>${D.profile.messages.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
      <h3>פערים שסומנו לחיזוק</h3>
      <ul>${D.profile.gaps.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    </details>

    <details class="card flat"><summary>תיאור המשרה ומה הוא אומר לך</summary>
      <p class="small muted">מקור: <span class="ltr">jobs.ashbyhq.com</span> · ${esc(D.job.location)}</p>
      <div class="ltr small">${esc(D.job.summary)}</div>
      <h3>Responsibilities</h3><ul class="ltr small job">${D.job.responsibilities.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <h3>Requirements</h3><ul class="ltr small job">${D.job.requirements.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <h3>Advantages</h3><ul class="ltr small job">${D.job.advantages.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <h3>הדגשים בעברית ומה מתרגלים לכל אחד</h3>
      <ul>${D.job.focus.map(f => `<li>${esc(f.he)} – ${f.cats.map(c => `<span class="badge">${esc(D.cats[c].he)}</span>`).join(" ")}</li>`).join("")}</ul>
    </details>

    <details class="card flat"><summary>22 התרגולים שכבר עשית ב-ChatGPT – התיקונים לזכור</summary>
      <p class="small muted">השאלות האלה לא נשאלות שוב באותו ניסוח. כאן רק התיקונים, לחזרה מהירה.</p>
      ${D.pastPractice.map(p => `<div class="stack"><div class="row between"><b>${esc(p.q)}</b>${p.s ? `<span class="badge">${esc(p.s)}/10</span>` : ""}</div><ul class="small">${p.fix.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>`).join("<hr>")}
    </details>`;

    $("#randQ").onclick = () => { const it = pickNew(cur); if (it) location.hash = "q-" + it.id; };
    const w = $("#weakQ"); if (w) w.onclick = () => { const it = pickWeak(cur); if (it) location.hash = "q-" + it.id; };
    main.querySelectorAll("[data-stage]").forEach(a => a.onclick = () => { practiceState.stage = a.dataset.stage; });
    const fb = $("#finishBtn");
    if (fb) fb.onclick = () => {
      const box = $("#finishBox");
      const s2 = stageStats(cur);
      box.innerHTML = `<div class="confirm">
        <b>לסמן את השלב כגמור?</b>
        <p class="small">תרגלת ${s2.answered} מתוך ${s2.total} שאלות בשלב, ממוצע ${fmt(s2.avg)}. ${s2.answered < s2.total / 3 ? "תרגלת פחות משליש מהשאלות. אם הריאיון עוד לא התקיים, כדאי להמשיך." : ""} סימון השלב פותח את השלב הבא. שאלות השלב הזה יישארו זמינות לתרגול.</p>
        <div class="row"><button class="btn gold" id="yesFinish">כן, השלב הסתיים</button><button class="btn ghost" id="noFinish">עוד לא</button></div>
      </div>`;
      $("#noFinish").onclick = () => viewHome(main);
      $("#yesFinish").onclick = () => {
        st.finished[cur] = true;
        if (cur === "tl") st.unlocked.tech = true;
        if (cur === "tech") st.unlocked.final = true;
        E.save(); toast("השלב הבא נפתח"); route();
      };
    };
  }

  function pickNew(stageKey, cat) {
    let pool = stageOf(stageKey).items().filter(i => !cat || i.c === cat || i.k === cat);
    const fresh = pool.filter(i => E.best(i.id) == null);
    const src = fresh.length ? fresh : pool;
    return src[Math.floor(Math.random() * src.length)];
  }
  function pickWeak(stageKey) {
    const pool = stageOf(stageKey).items().filter(i => { const b = E.best(i.id); return b != null && b < 7; });
    return pool.sort((a, b) => E.best(a.id) - E.best(b.id))[0];
  }

  /* ───────── Practice list ───────── */
  const practiceState = { stage: null, cat: "", filter: "all" };
  function viewPractice(main) {
    const st = E.state;
    if (!practiceState.stage || (practiceState.stage !== "tl" && !st.unlocked[practiceState.stage])) practiceState.stage = currentStage();
    const sk = practiceState.stage;
    const items = stageOf(sk).items();
    const cats = sk === "tech" ? Object.entries(D.stage2Kinds).map(([k, v]) => [k, v.he]) : [...new Set(items.map(i => i.c))].map(c => [c, D.cats[c].he]);
    let list = items.filter(i => !practiceState.cat || i.c === practiceState.cat || i.k === practiceState.cat);
    if (practiceState.filter === "new") list = list.filter(i => E.best(i.id) == null);
    if (practiceState.filter === "weak") list = list.filter(i => { const b = E.best(i.id); return b != null && b < 7; });
    main.innerHTML = `
    <section class="stack">
      <div class="row between"><h1>בנק שאלות</h1><a class="btn sm primary" href="#sim">${icon("mic")} סימולציה</a></div>
      <div class="chips" role="group" aria-label="שלב">
        ${STAGES.filter(s => s.key !== "hr").map(s => {
          const open = s.key === "tl" || st.unlocked[s.key];
          return `<button class="chip" data-st="${s.key}" aria-pressed="${s.key === sk}" ${open ? "" : "disabled"}>${open ? "" : "🔒 "}${esc(s.short)}</button>`;
        }).join("")}
      </div>
      <div class="chips" role="group" aria-label="נושא">
        <button class="chip" data-cat="" aria-pressed="${!practiceState.cat}">הכול (${items.length})</button>
        ${cats.map(([k, he]) => `<button class="chip" data-cat="${k}" aria-pressed="${practiceState.cat === k}">${esc(he)}</button>`).join("")}
      </div>
      <div class="chips" role="group" aria-label="סינון">
        ${[["all", "הכול"], ["new", "לא תורגלו"], ["weak", "ציון מתחת ל-7"]].map(([k, he]) => `<button class="chip" data-f="${k}" aria-pressed="${practiceState.filter === k}">${he}</button>`).join("")}
      </div>
    </section>
    <section class="qlist">
      ${list.length ? list.map(i => {
        const b = E.best(i.id);
        return `<button class="qitem" data-id="${i.id}">
          <div><p>${esc(i.title ? i.title + " – " + qText(i) : qText(i))}</p>
          <div class="meta"><span class="badge">${esc(catLabel(i))}</span><span class="badge">רמה ${i.lv}</span>${i.time ? `<span class="badge">${i.time} דק'</span>` : ""}${i.resume ? `<span class="badge gold">נקודת ההמשך</span>` : ""}</div></div>
          <span class="score-dot ${scoreCls(b)}">${fmt(b)}</span></button>`;
      }).join("") : `<div class="empty">אין שאלות שמתאימות לסינון.</div>`}
    </section>`;
    main.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { practiceState.stage = b.dataset.st; practiceState.cat = ""; viewPractice(main); });
    main.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { practiceState.cat = b.dataset.cat; viewPractice(main); });
    main.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { practiceState.filter = b.dataset.f; viewPractice(main); });
    main.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { location.hash = "q-" + b.dataset.id; });
  }

  /* ───────── Single question ───────── */
  function viewQuestion(main, id) {
    const it = findItem(id);
    if (!it) { main.innerHTML = `<div class="empty">השאלה לא נמצאה. <a href="#practice">לבנק השאלות</a></div>`; return; }
    const stageKey = it._s;
    main.innerHTML = `<div class="row"><a class="btn sm ghost" href="#practice">${icon("back")} לבנק השאלות</a></div><div id="runner"></div>`;
    runQuestion($("#runner"), it, {
      stage: stageKey,
      onNext: () => { const n = pickNew(stageKey, it.c || it.k); location.hash = "q-" + (n && n.id !== it.id ? n.id : pickNew(stageKey).id); }
    });
  }

  /* ───────── Runner ───────── */
  function runQuestion(root, it, opts) {
    const isTech = !!it.k;
    const prevAttempts = E.state.attempts[it.id] || [];
    let kbStart = 0, text = "", interimText = "", audioUrl = null, mode = "text", timerId = null, ctl = null, evaluated = null;
    const openedAt = performance.now();
    const target = isTech ? (it.time || 10) * 60 : E.state.settings.qSeconds;

    const rec = new E.Recorder({
      onText: t => { const ta = $("#ans", root); const v = ta.value; ta.value = (v && !/\s$/.test(v) ? v + " " : v) + t.trim(); text = ta.value; },
      onInterim: t => { interimText = t; const el = $("#interim", root); if (el) el.textContent = t; },
      onState: (s, extra) => {
        const b = $("#recBtn", root);
        if (s === "on") { mode = "voice"; b.classList.add("on", "stop"); b.innerHTML = icon("stop"); b.setAttribute("aria-label", "עצור הקלטה"); $("#recHint", root).textContent = "מקליט… דבר כמו בריאיון"; }
        if (s === "off") { b.classList.remove("on", "stop"); b.innerHTML = icon("mic"); b.setAttribute("aria-label", "התחל הקלטה"); $("#recHint", root).textContent = extra && extra !== "stopped" && extra !== "viewer_stopped" ? recError(extra) : "ההקלטה נעצרה. אפשר לתקן את התמלול ואז לבקש משוב."; }
        if (s === "audio") { audioUrl = extra; const a = $("#audioBox", root); a.innerHTML = `<p class="small muted">ההקלטה שלך – שמע את עצמך:</p><audio controls src="${extra}"></audio>`; }
        if (s === "error") { $("#recHint", root).textContent = recError(extra); }
      }
    });

    function recError(r) {
      if (r === "claude-frame" || r === "unavailable" || r === "unsupported") { keyboardMic(); return KB_TIP; }
      if (r === "not_granted" && E.inClaude) { showPermBtn(); keyboardMic(); return "ההכתבה של claude.ai כבויה לעמוד הזה. אפשר להפעיל אותה בכפתור ההרשאות, או לענות עכשיו עם המיקרופון של המקלדת."; }
      if (r === "denied" || r === "not_granted") { keyboardMic(); return "אין הרשאה למיקרופון. אפשר להפעיל אותה בהגדרות האתר בדפדפן, או לענות עם המיקרופון של המקלדת."; }
      if (r === "unsupported" || r === "unavailable") return "התמלול לא נתמך כאן. אפשר להקליד, או להשתמש במיקרופון של המקלדת בתוך התיבה.";
      if (r === "mic") return "לא הצלחתי לפתוח את המיקרופון.";
      if (r === "hidden") return "ההקלטה נעצרה כי המסך הוסתר.";
      return "ההקלטה נעצרה.";
    }

    function keyboardMic() { const t = $("#ans", root); if (t) { t.focus(); t.scrollIntoView({ block: "center", behavior: "smooth" }); } }
    function showPermBtn() {
      const b = $("#permBtn", root); if (!b) return;
      b.hidden = false;
      b.onclick = () => E.openPermissions().then(() => { $("#recHint", root).textContent = "אם הפעלת הכתבה, לחץ שוב על המיקרופון."; }).catch(() => toast("פתח את תפריט ההרשאות של העמוד ב-claude.ai"));
    }
    const sup = E.Recorder.support();
    const canRec = sup.dictation || sup.speech || sup.media;
    root.innerHTML = `
    <section class="card">
      <div class="row between">
        <div class="row" style="gap:6px">${opts.position ? `<span class="badge violet">${opts.position}</span>` : ""}<span class="badge">${esc(catLabel(it))}</span><span class="badge">רמה ${it.lv}</span>${it.resume ? '<span class="badge gold">נקודת ההמשך</span>' : ""}</div>
        ${prevAttempts.length ? `<span class="badge ${scoreCls(E.best(it.id))}">הכי טוב: ${fmt(E.best(it.id))}</span>` : ""}
      </div>
      ${it.title ? `<h2>${esc(it.title)}</h2>` : ""}
      <p class="qtext">${esc(qText(it))}</p>
      ${it.code ? `<pre class="code">${esc(it.code)}</pre>` : ""}
      <div class="row"><button class="btn sm ghost" id="speakBtn">${icon("spk")} הקרא לי את השאלה</button>
      <span class="small muted">${isTech ? `זמן מומלץ: ${it.time} דקות` : "יעד: 1-2 דקות דיבור"}</span></div>
    </section>

    <section class="card">
      <div class="rec">
        <button class="recbtn" id="recBtn" aria-label="${canRec ? "התחל הקלטה" : "ענה בעל פה עם מיקרופון המקלדת"}">${icon("mic")}</button>
        <div class="stack" style="gap:2px;flex:1;min-width:0">
          <span class="timer" id="timer">00:00</span>
          <span class="small muted" id="recHint">${canRec ? "לחץ והתחל לדבר. התמלול יופיע בתיבה." : KB_TIP}</span>
          <button class="btn sm ghost" id="permBtn" hidden>פתח הרשאות של העמוד</button>
        </div>
      </div>
      <p class="interim" id="interim" aria-live="polite"></p>
      <label class="field" for="ans">${isTech ? "ההסבר שלך (בעל פה או בהקלדה)" : "התשובה שלך (תמלול – אפשר לערוך)"}</label>
      <textarea id="ans" class="answer" dir="rtl" placeholder="${isTech ? "תסביר כאן את מה שמצאת ואת ההחלטות שלך…" : "התמלול יופיע כאן, או הקלד…"}"></textarea>
      ${isTech && it.k !== "explain" ? `<label class="field" for="codeAns">הקוד שלך</label><textarea id="codeAns" class="answer codeed" dir="ltr" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(it.code || "")}</textarea>` : ""}
      <div id="audioBox"></div>
      <button class="btn primary block" id="evalBtn">${icon("spark")} קבל משוב</button>
    </section>
    <div id="fb"></div>
    <details class="card flat" id="peek"><summary>הצצה לנקודות המפתח (עדיף אחרי שעונים)</summary>
      <ul class="points">${(it.p || []).map(p => `<li class="miss"><span class="ic">•</span><span>${esc(p[0])}</span></li>`).join("")}</ul>
      ${it.t ? `<p class="note">${esc(it.t)}</p>` : ""}
    </details>
    ${prevAttempts.length ? `<details class="card flat"><summary>ניסיונות קודמים (${prevAttempts.length})</summary>${prevAttempts.slice(-5).reverse().map(a => `<div class="stack"><div class="row between"><span class="small muted">${new Date(a.ts).toLocaleString("he-IL")}</span><span class="badge ${scoreCls(a.score)}">${fmt(a.score)}</span></div><p class="small">${esc((a.text || "").slice(0, 400))}${(a.text || "").length > 400 ? "…" : ""}</p></div>`).join("<hr>")}</details>` : ""}`;

    const ta = $("#ans", root);
    ta.addEventListener("input", () => { text = ta.value; });
    $("#speakBtn", root).onclick = () => { if (!E.speak(qText(it))) toast("הקראה לא נתמכת בדפדפן הזה"); };
    $("#recBtn", root).onclick = () => {
      if (!E.Recorder.support().dictation && !E.Recorder.support().speech && !E.Recorder.support().media) { keyboardMic(); $("#recHint", root).textContent = KB_TIP; mode = "voice"; if (!kbStart) kbStart = performance.now(); startTimer(); return; }
      if (rec.active) { rec.stop(); stopTimer(); }
      else { rec.start(); startTimer(); }          // start נקרא ישירות מהלחיצה
    };
    function startTimer() {
      stopTimer();
      timerId = setInterval(() => {
        const s = isTech ? (performance.now() - openedAt) / 1000 : kbStart ? (performance.now() - kbStart) / 1000 : rec.seconds();
        const el = $("#timer", root); if (!el) return;
        el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
        el.classList.toggle("over", s > target);
      }, 250);
    }
    function stopTimer() { if (timerId && !isTech) { clearInterval(timerId); timerId = null; } }
    if (isTech) startTimer();

    $("#evalBtn", root).onclick = async () => {
      if (rec.active) rec.stop();
      const answer = { text: ta.value.trim(), code: ($("#codeAns", root) || {}).value };
      if (answer.code && answer.code.trim() === (it.code || "").trim()) answer.code = "";
      if (!answer.text && !answer.code) { toast("אין עדיין תשובה. הקלט או הקלד קודם."); return; }
      const btn = $("#evalBtn", root);
      btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> ${E.providerAvailable() === "offline" ? "בודק…" : "המראיין קורא את התשובה…"}`;
      ctl = new AbortController();
      const meta = { stage: opts.stage, mode, dur: mode === "voice" ? (kbStart ? (performance.now() - kbStart) / 1000 : rec.seconds()) : 0 };
      let fb;
      try { fb = await E.evaluate(it, answer, meta, ctl.signal); }
      catch (e) { btn.disabled = false; btn.innerHTML = `${icon("spark")} קבל משוב`; return; }
      if (!(it.p && it.p.length) && fb.src === "offline") fb.score = null;
      evaluated = { answer, fb, meta };

  function buildSim(stage, n) {
    const items = stageOf(stage).items();
    const fresh = i => E.best(i.id) == null;
    const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
    const chosen = [];
    if (stage === "tl") {
      const resume = items.find(x => x.resume && fresh(x));
      if (resume) chosen.push(resume.id);
      const flow = D.simFlow.slice(0, n);
      for (const c of flow) {
        if (chosen.length >= n) break;
        const pool = shuffle(items.filter(i => i.c === c && !chosen.includes(i.id)));
        const pick = pool.find(fresh) || pool[0];
        if (pick) chosen.push(pick.id);
      }
    }
    const rest = shuffle(items.filter(i => !chosen.includes(i.id)));
    rest.sort((a, b) => (fresh(b) ? 1 : 0) - (fresh(a) ? 1 : 0));
    while (chosen.length < n && rest.length) chosen.push(rest.shift().id);
    return chosen.slice(0, n);
  }

      <div id="diag" class="small muted">בודק…</div>
      <div class="row"><button class="btn sm" id="testSpeak">${icon("spk")} נסה הקראה</button><button class="btn sm ghost" id="permOpen" hidden>פתח הרשאות של העמוד</button></div>
    </section>
    <section class="card">
      <h2>הקלטה ותצוגה</h2>
      <label class="check"><input type="checkbox" id="keepAudio" ${s.keepAudio ? "checked" : ""}><span>שמור הקלטת קול לשמיעה חוזרת (בחלק מהמכשירים זה מתנגש עם התמלול, ואז ההקלטה תכובה אוטומטית)</span></label>
      <label class="field" for="qsec">יעד זמן לתשובה בעל פה (שניות)<input id="qsec" type="number" min="30" max="600" step="10" value="${s.qSeconds}"></label>
      <label class="field" for="theme">ערכת צבעים
        <select id="theme"><option value="system" ${s.theme === "system" ? "selected" : ""}>לפי המכשיר</option><option value="light" ${s.theme === "light" ? "selected" : ""}>בהיר</option><option value="dark" ${s.theme === "dark" ? "selected" : ""}>כהה</option></select></label>
    </section>
    <section class="card">
      <h2>גיבוי התקדמות</h2>
      <p class="small muted">ההתקדמות נשמרת בדפדפן הזה בלבד. כדי להעביר למכשיר אחר: העתק כאן, והדבק במכשיר השני. המפתח לא נכלל בגיבוי.</p>
      <div class="row"><button class="btn" id="exp">העתק גיבוי</button></div>
      <textarea id="impTxt" class="answer" dir="ltr" placeholder="הדבק כאן גיבוי כדי לשחזר" style="min-height:80px"></textarea>
      <div class="row"><button class="btn" id="imp">שחזר מגיבוי</button><button class="btn ghost" id="resetBtn">איפוס כל ההתקדמות</button></div>
      <div id="resetBox"></div>
    </section>
    <section class="card">
      <h2>התקנה בטלפון</h2>
      <p class="small">Android (Chrome): תפריט ⋮ ← "הוספה למסך הבית". iPhone (Safari): כפתור השיתוף ← "הוספה למסך הבית". אחרי ההתקנה האפליקציה עובדת גם בלי רשת. הערכת AI צריכה רשת.</p>
    </section>`;
    E.diag().then(d => {
      const box = $("#diag"); if (!box) return;
      const yes = v => v ? "✓ זמין" : "✗ לא זמין";
      const lines = d.inClaude
        ? [`האפליקציה פתוחה בתוך claude.ai.`, `הכתבה של claude.ai: ${yes(d.dictation)}${d.dictationState ? " (" + ({ granted: "מאושר", prompt: "תתבקש לאשר בלחיצה הראשונה", denied: "נדחה – אפשר להפעיל בהרשאות", unavailable: "לא זמין" }[d.dictationState] || d.dictationState) + ")" : ""}`, `הקראה של claude.ai: ${yes(d.tts)}`,
           d.dictation ? "" : "במכשיר הזה claude.ai לא מאפשר מיקרופון לעמוד. הדרך לענות בעל פה: מיקרופון המקלדת בתוך תיבת התשובה, או גרסת האתר העצמאית."]
        : [`תמלול דיבור בדפדפן: ${yes(d.speechAPI)}`, `הקראה בדפדפן: ${yes(d.synth)}`];
      box.innerHTML = lines.filter(Boolean).map(l => `<p>${esc(l)}</p>`).join("");
      if (d.inClaude && d.dictationState === "denied") { const b = $("#permOpen"); b.hidden = false; b.onclick = () => E.openPermissions().then(() => viewSettings(main)).catch(() => toast("פתח את תפריט ההרשאות של העמוד ב-claude.ai")); }
    });
    $("#testSpeak").onclick = () => { if (!E.speak("שלום, זו בדיקת הקראה של השאלות.")) toast("הקראה לא זמינה כאן"); };
    $("#saveAi").onclick = () => { s.provider = $("#prov").value; s.apiKey = $("#key").value.trim(); s.model = $("#model").value; E.save(); toast("נשמר"); };
    $("#keepAudio").onchange = e => { s.keepAudio = e.target.checked; E.save(); };
    $("#qsec").onchange = e => { s.qSeconds = Math.max(30, Math.min(600, +e.target.value || 120)); E.save(); };
    $("#theme").onchange = e => { s.theme = e.target.value; E.save(); applyTheme(); };
    $("#exp").onclick = () => {
      const data = E.exportJSON();
      navigator.clipboard.writeText(data).then(() => toast("הגיבוי הועתק"), () => { const t = $("#impTxt"); t.value = data; t.select(); toast("סמן והעתק את הטקסט בתיבה"); });
    };
    $("#imp").onclick = () => { try { E.importJSON($("#impTxt").value); applyTheme(); toast("ההתקדמות שוחזרה"); route(); } catch (e) { toast("הטקסט לא נראה כמו גיבוי תקין"); } };
    $("#resetBtn").onclick = () => {
      $("#resetBox").innerHTML = `<div class="confirm"><b>למחוק את כל ההתקדמות?</b><p class="small">כל התשובות, הציונים והשלבים יימחקו. אי אפשר לבטל.</p><div class="row"><button class="btn gold" id="yesReset">מחק</button><button class="btn ghost" id="noReset">ביטול</button></div></div>`;
      $("#noReset").onclick = () => $("#resetBox").innerHTML = "";
      $("#yesReset").onclick = () => { E.reset(); toast("ההתקדמות אופסה"); route(); };
    };
  }

  /* ───────── Boot ───────── */
  function boot() {
    E.load(); applyTheme();
    $("#nav").innerHTML = `<div class="row">
      <a href="#home" data-k="home">${icon("home")}<span>בית</span></a>
      <a href="#practice" data-k="practice">${icon("list")}<span>תרגול</span></a>
      <a href="#terms" data-k="terms">${icon("book")}<span>מונחים</span></a>
      <a href="#coin" data-k="coin">${icon("coin")}<span>Coin Master</span></a>
      <a href="#settings" data-k="settings">${icon("gear")}<span>הגדרות</span></a></div>`;
    window.addEventListener("hashchange", route);
    route();
    Promise.all([E.initSample(), E.initDictation()]).then(() => { if ((location.hash || "#home") === "#home") route(); });
    if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !window.claude) {
      navigator.serviceWorker.register("sw.js").catch(() => { });
    }
  }
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
